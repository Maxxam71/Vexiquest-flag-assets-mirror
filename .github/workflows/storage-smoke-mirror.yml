name: Ten chapter map helper build

on:
  pull_request:
    branches:
      - main
    paths:
      - "map-helper/**"
      - ".github/workflows/storage-smoke-mirror.yml"

permissions:
  contents: read

jobs:
  helper-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace one-chapter helper with generic helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f map-helper/app/src/main/java/com/example/expedition/ui/NorthernGatewaysMap.kt
          mkdir -p map-helper/app/src/main/java/com/example/expedition/ui
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            --output map-helper/app/src/main/java/com/example/expedition/ui/AllChaptersMap.kt \
            https://raw.githubusercontent.com/Maxxam71/Vexiquest-flag-assets-mirror/all-chapters-map-helper/map-prototype/app/src/main/java/com/example/expedition/ui/AllChaptersMap.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
          cache-disabled: true

      - name: Build helper APK
        shell: bash
        run: |
          set +e
          gradle -p map-helper :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee map-helper/build.log
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-chapters-map-helper-build-log-v2
          path: map-helper/build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload helper APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: all-chapters-map-helper-apk-v2
          path: map-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
