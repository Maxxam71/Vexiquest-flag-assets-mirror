name: Build private Vexiquest APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private Vexiquest branch, tag, or commit to build
        required: true
        default: agent/south-american-wonders-mission-ledger-189
  push:
    branches:
      - main
    paths:
      - .github/build-trigger/**
  pull_request:
    branches:
      - main
    paths:
      - .github/private-build-trigger/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VEXIQUEST_SOURCE_REF: ${{ inputs.source_ref || 'agent/south-american-wonders-mission-ledger-189' }}

    steps:
      - name: Check out private Vexiquest source
        uses: actions/checkout@v4
        with:
          repository: Maxxam71/Vexiquest
          ref: ${{ env.VEXIQUEST_SOURCE_REF }}
          token: ${{ secrets.VEXIQUEST_PAT }}
          path: vexiquest
          persist-credentials: false

      - name: Apply queued Vexiquest source maintenance
        working-directory: vexiquest
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/APPLY_V1411_RUNTIME_FIXES ]; then
            python3 tools/apply_v1411_runtime_fixes_final.py
          fi
          if [ -f tools/APPLY_V155_GAMEPLAY_UI_FIXES ]; then
            python3 tools/apply_v155_gameplay_ui_fixes.py
          fi
          if [ -f tools/APPLY_V155_PROFILE_SCROLLBAR_COMPILE_FIX ]; then
            python3 tools/fix_v155_profile_scrollbar_compilation.py
          fi
          if [ -f tools/APPLY_V155_GAMEPLAY_POLICY_FIX ]; then
            python3 tools/fix_v155_gameplay_policy_tests.py
          fi
          if [ -f tools/APPLY_V186_FULL_EXPEDITION_THEME ]; then
            python3 tools/apply_v186_full_expedition_theme.py
          fi
          if [ -f tools/APPLY_V188_EXPEDITION_REFINEMENT ]; then
            python3 tools/apply_v188_expedition_refinement.py
          fi
          if [ -f tools/APPLY_V189_MISSION_LEDGER ]; then
            python3 tools/apply_v189_mission_ledger.py
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-disabled: true

      - name: Create ephemeral debug signing key when absent
        working-directory: vexiquest
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Vexiquest Debug,O=Vexiquest,C=BR"
          fi

      - name: Build debug APK
        working-directory: vexiquest
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > gradle-build.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            tail -n 400 gradle-build.log
            exit "$STATUS"
          fi
          tail -n 100 gradle-build.log

      - name: Upload Gradle diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Vexiquest-gradle-diagnostics-${{ github.run_number }}
          path: vexiquest/gradle-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Record APK hashes
        working-directory: vexiquest
        shell: bash
        run: |
          find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | xargs -0 sha256sum | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vexiquest-private-debug-${{ github.run_number }}
          path: |
            vexiquest/app/build/outputs/apk/debug/*.apk
            vexiquest/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
